<!doctype html>
<html lang="zh-Hant-TW"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>共用教材</title><link rel="stylesheet" href="../assets/grade7/game.css"><style>input,textarea{max-width:100%;box-sizing:border-box}textarea{width:100%;min-height:9em}label{display:block;margin:.7em 0}table{width:100%}td input{width:100%}.table-scroll{overflow:auto}#errors{white-space:pre-line}#launch button{margin:.3em}</style></head>
<body><header><a href="../index.html#english">回到大廳</a></header><main><h1>共用教材</h1><p>輸入一次，供配對、翻牌與打字共用。教材保留於本分頁，請匯出 JSON 保存。匯入與編輯的內容只在瀏覽器中使用。</p>
<section class="panel"><h2>課別</h2><div id="metadata"></div><label>目標（逗號分隔）<input id="goals" value="meaning-recognition,spelling"></label></section>
<section class="panel"><h2>輸入教材</h2><label>貼上英文與中文，每列以 Tab 分隔<textarea id="paste" placeholder="apple&#9;蘋果"></textarea></label><button id="preview">預覽詞表</button><label>匯入 JSON<input id="import" type="file" accept=".json,application/json"></label><p id="errors" role="status"></p><div class="table-scroll"><table><thead><tr><th>ID</th><th>英文</th><th>中文</th><th>英文例句</th><th>中文例句</th><th>操作</th></tr></thead><tbody id="words"></tbody></table></div><button id="export">匯出 JSON</button></section>
<section class="panel"><h2>選擇遊戲模式</h2><p>缺例句或有歧義的資料會在下方說明，補齊後可開始。</p><div id="launch"></div></section></main><script src="../assets/lessons/content.js"></script><script src="../assets/lessons/editor.js"></script></body></html>
