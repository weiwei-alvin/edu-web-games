<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="給課堂使用的遊戲目錄。找單字、句型、口說與閱讀練習，選好就能開始。">
  <meta name="theme-color" content="#f5f2e9" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#18231f" media="(prefers-color-scheme: dark)">
  <title>Edu Web Games｜課堂遊戲目錄</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='4' fill='%23263d35'/%3E%3Cpath d='M8 8h16v5H13v3h9v4h-9v4H8z' fill='%23f5f2e9'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="./assets/lobby.css">
</head>
<body>
  <a class="skip" href="#content">跳到遊戲列表</a>
  <header class="topbar">
    <div class="topbar__inner">
      <a class="brand" href="#all" aria-label="回到遊戲大廳首頁">
        <span class="brand__mark" aria-hidden="true">E</span>
        <span class="brand__text"><strong>Edu Web Games</strong><small>課堂遊戲室</small></span>
      </a>
      <button class="btn-random" id="randomBtn" type="button">隨機選一個 <span aria-hidden="true">↗</span></button>
    </div>
  </header>
  <main class="page">
    <section class="hero" aria-labelledby="heroTitle">
      <div class="hero__copy">
        <p class="hero__eyebrow">遊戲目錄</p>
        <h1 id="heroTitle">今天，玩哪一個？</h1>
        <p class="hero__sub" id="heroStats">讀取遊戲中…</p>
      </div>
      <label class="search" for="searchInput">
        <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></svg>
        <input id="searchInput" type="search" placeholder="找遊戲、單字或學習重點" aria-label="搜尋遊戲" autocomplete="off">
        <kbd class="search__key" aria-hidden="true">/</kbd>
      </label>
    </section>
    <p><a href="./lesson-editor/index.html">輸入共用教材（配對、翻牌、打字）</a></p><nav class="subjects" id="subjectNav" aria-label="科目專區"></nav>
    <div id="content" class="content" tabindex="-1"></div>
  </main>
  <footer class="footer">
    <p>Edu Web Games <span aria-hidden="true">／</span> 課堂遊戲室</p>
    <p id="footerStats"></p>
  </footer>
  <noscript><div class="noscript">這個頁面需要開啟 JavaScript。也可以直接打開：<a href="./telling-time/">英文報時練習</a>、<a href="./body-parts/">身體部位單字</a>、<a href="./speaking-cards/">動作說話卡</a>。</div></noscript>
  <script src="./assets/catalog.js"></script>
  <script src="./assets/lobby.js"></script>
</body>
</html>
